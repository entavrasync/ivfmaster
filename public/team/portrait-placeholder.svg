<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title description">
  <title id="title">Portrait photo placeholder</title>
  <desc id="description">A soft lavender and ivory abstract background reserved for a doctor portrait.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9def2"/>
      <stop offset="0.52" stop-color="#eceff9"/>
      <stop offset="1" stop-color="#fbf7f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="25%" r="65%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#base)"/>
